  #app .plan h3 { font-size: 15px; margin: 16px 0 8px; color: var(--deep); letter-spacing: .02em; }

  ];

  var PLAN_MEALS = [
    ['23 저녁', '삼겹살 · 목살, 아이용 소시지 · 떡갈비, 버섯 · 양파 · 마늘, 쌈, 김치, 밥, 된장찌개', '고기 마당 그릴 / 찌개 · 밥 실내'],
    ['24 아침', '밥, 미역국(고기 없이), 계란말이, 김, 밑반찬. 아이 시리얼 · 우유', '실내'],
    ['24 점심', '라면 + 즉석밥 + 김치 + 삶은 계란 + 과일. 대안 을왕리 칼국수 외식', '실내'],
    ['24 저녁', '캔 조개로 조개구이 · 조개탕, 소불고기, 밥, 반찬. 수확 적으면 바지락 보충', '마당 그릴 + 버너'],
    ['25 아침', '떡국(사골곰탕 팩 + 떡국떡 + 계란지단 · 김), 송편, 김치', '실내']
  ];

  var PLAN_NOTES = [
    '인천 중구 용유로380번길 62 · 체크인 15:00 · 체크아웃 11:00 · 주차 3대',
    '실내에서 고기 · 생선 조리 금지 → 마당 그릴 · 버너를 쓴다',
    '근처에 마트 · 편의점 없음. 하나로마트 평일 9~17시, CU 차로 10분',
    '갯벌 요금은 현장결제만: 어른 1만 · 초등 5천 · 미취학 3천, 호미 1천 · 장화 2천'
  ];

  function seed() {
    var items = [], n = 0;
    SEED.forEach(function (sec) {
      sec[2].forEach(function (it) {
        items.push({
          id: 'i' + (n++),
          cat: sec[0],
          name: it[0],
          memo: it[1],
          done: false,
          who: it.length > 2 ? it[2] : sec[1]
        });
      });
    });
    return { v: 1, families: FAM_DEFAULT.slice(), items: items };
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
    });
  }

  function famName(i) {
    return (state.families && state.families[i]) || FAM_DEFAULT[i];
  }

  function setStatus(msg) {
    var el = app.querySelector('.status');
    if (el) { el.textContent = msg; if (msg) setTimeout(function () { if (el.textContent === msg) el.textContent = ''; }, 1600); }
  }

  // ---------- 동기화 ----------
  // 정본은 Cloudflare Worker(Durable Object)에 있고, WebSocket 으로 접속한 모든
  // 사람에게 변경이 즉시 전달된다. localStorage 는 첫 화면을 바로 그리기 위한
  // 캐시일 뿐이므로, 서버 상태가 오면 항상 덮어쓴다.
  var WORKER_HOST = 'waterpark-sync.shwoo.workers.dev';
  var ROOM = 'chuseok-2026-incheon';

  var CONN_TEXT = {
    connecting: '연결 중…',
    live: '실시간 연결됨',
    offline: '연결 끊김 — 변경은 연결되면 반영됩니다'
  };
  var conn = { ws: null, ready: false, tries: 0, queue: [], state: 'connecting' };

  function cacheSave() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
  }
  function cacheLoad() {
    try {
      var v = localStorage.getItem(KEY);
      if (!v) return null;
      var s = JSON.parse(v);
      if (!s || !Array.isArray(s.items)) return null;
      s.families = normFam(s.families);
      return s;
    } catch (e) { return null; }
  }

  // 예전 캐시나 깨진 값이 와도 항상 세 칸을 채운다.
  function normFam(f) {
    var out = [];
    for (var i = 0; i < FAM_N; i++) {
      out.push((Array.isArray(f) && f[i]) ? f[i] : FAM_DEFAULT[i]);
    }
    return out;
  }

  function setConn(s) {
    conn.state = s;
    var el = app.querySelector('.conn');
    if (el) { el.className = 'conn ' + s; el.textContent = CONN_TEXT[s] || ''; }
  }

  // 연결이 끊겨 있으면 큐에 쌓아뒀다가 재연결 시 순서대로 흘려보낸다.
  function send(msg) {
    if (conn.ready) {
      try { conn.ws.send(JSON.stringify(msg)); return; } catch (e) {}
    }
    conn.queue.push(msg);
  }

  function connect() {
    if (WORKER_HOST.indexOf('__') === 0) { setConn('offline'); return; }
    var ws;
    var proto = /^(localhost|127\.0\.0\.1)(:|$)/.test(WORKER_HOST) ? 'ws://' : 'wss://';
    try {
      ws = new WebSocket(proto + WORKER_HOST + '/ws?room=' + encodeURIComponent(ROOM));
    } catch (e) { retry(); return; }
    conn.ws = ws;

    ws.onopen = function () {
      conn.ready = true;
      conn.tries = 0;
      // 밀린 변경을 먼저 보내고 나서 최신 상태를 요청해야, 방금 보낸 것이
      // 빠진 스냅샷으로 덮어써지지 않는다.
      var q = conn.queue;
      conn.queue = [];
      q.forEach(function (m) { try { ws.send(JSON.stringify(m)); } catch (e) {} });
      try { ws.send(JSON.stringify({ t: 'hello' })); } catch (e) {}
      setConn('live');
    };

    ws.onmessage = function (ev) {
      var m;
      try { m = JSON.parse(ev.data); } catch (e) { return; }

      if (m.t === 'snap') {
        if (m.empty) {
          // 방이 비어 있다 — 기본 목록을 심는다. 여럿이 동시에 들어와도
          // id 가 결정적이라 결과가 같고, 서버도 비어 있을 때만 받는다.
          var s = seed();
          send({ t: 'seed', families: s.families, items: s.items });
          return;
        }
        state = { v: 1, families: normFam(m.families), items: m.items };
        cacheSave();
        render();
      } else if (m.t === 'op') {
        applyOp(m.op);
        cacheSave();
        render();
      }
    };

    ws.onclose = function () { conn.ready = false; setConn('offline'); retry(); };
    ws.onerror = function () { try { ws.close(); } catch (e) {} };
  }

  function retry() {
    conn.tries++;
    setTimeout(connect, Math.min(1000 * Math.pow(2, conn.tries - 1), 15000));
  }

  function sortItems() {
    state.items.sort(function (a, b) { return (a.ord || 0) - (b.ord || 0); });
  }

  function applyOp(op) {
    if (!op || !state) return;
    if (op.t === 'set') {
      var it = find(op.id);
      if (!it) return;
      var p = op.patch || {};
      if ('done' in p) it.done = !!p.done;
      if ('who' in p) it.who = p.who;
      if ('memo' in p) it.memo = p.memo;
      if ('name' in p) it.name = p.name;
    } else if (op.t === 'add' && op.item) {
      var ex = find(op.item.id);
      if (ex) { ex.ord = op.item.ord; }   // 서버가 정한 순서로 교정
      else { state.items.push(op.item); }
      sortItems();
    } else if (op.t === 'del') {
      state.items = state.items.filter(function (x) { return x.id !== op.id; });
    } else if (op.t === 'fam') {
      var fi = op.i;
      if (fi >= 0 && fi < FAM_N) state.families[fi] = op.v;
    }
  }

  // 이름·메모·집 이름은 타이핑마다 보내지 않고 잠깐 모아서 보낸다.
  var pend = {}, pendFam = {};
  function queuePatch(id, patch) {
    pend[id] = Object.assign(pend[id] || {}, patch);
    schedule();
  }
  function queueFam(i, v) { pendFam[i] = v; schedule(); }
  function schedule() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function () {
      Object.keys(pend).forEach(function (k) { send({ t: 'set', id: k, patch: pend[k] }); });
      Object.keys(pendFam).forEach(function (i) { send({ t: 'fam', i: +i, v: pendFam[i] }); });
      pend = {}; pendFam = {};
      cacheSave();
      setStatus('저장됨');
    }, 350);
  }

  function visible(it) {
    if (filter === 'all') return true;
    if (filter === 'left') return !it.done;
    if (filter.charAt(0) === 'f') return it.who === +filter.slice(1);
    return true;
  }

  function planHtml() {
    var h = '<div class="plan">' +
      '<button class="plan-toggle" data-act="plan" aria-expanded="' + planOpen + '">' +
      '📋 일정 · 식단 · 숙소 메모<span class="chev">' + (planOpen ? '▲' : '▼') + '</span></button>' +
      '<div class="plan-body"' + (planOpen ? '' : ' hidden') + '>';

    h += '<h3>일정</h3><table><tbody>';
    PLAN_DAYS.forEach(function (d) {
      h += '<tr><td class="d">' + esc(d[0]) + '</td><td>' + esc(d[1]) + '</td></tr>';
    });
    h += '</tbody></table>';

    h += '<h3>식단</h3><table><thead><tr><th>끼니</th><th>메뉴</th><th>조리</th></tr></thead><tbody>';
    PLAN_MEALS.forEach(function (m) {
      h += '<tr><td class="d">' + esc(m[0]) + '</td><td>' + esc(m[1]) + '</td><td>' + esc(m[2]) + '</td></tr>';
    });
    h += '</tbody></table>';

    h += '<h3>숙소 · 갯벌 메모</h3><ul>';
    PLAN_NOTES.forEach(function (n) { h += '<li>' + esc(n) + '</li>'; });
    h += '</ul></div></div>';
    return h;
  }

  function render() {
    var cats = [];
    state.items.forEach(function (it) { if (cats.indexOf(it.cat) < 0) cats.push(it.cat); });

    var total = state.items.length;
    var done = state.items.filter(function (i) { return i.done; }).length;
    var pct = total ? Math.round(done / total * 100) : 0;

    var html = '';
    html += '<div class="tank"><div class="water" style="height:' + pct + '%"></div><div class="tank-inner">' +
      '<p class="eyebrow">추석 가족여행 · 인천 용유도</p>' +
      '<h1>세 집 준비물 체크</h1>' +
      '<p class="sub">9.23(수)~25(금) 2박 3일 · 어른 6 · 초등 2 · 유아 2<br>갯벌체험 + 취사</p>' +
      '<div class="count"><b>' + done + '</b><span>/ ' + total + '개 완료 · ' + pct + '%</span></div>' +
      '</div></div>';

    html += planHtml();

    html += '<div class="crew">';
    for (var i = 0; i < FAM_N; i++) {
      html += '<input class="' + WHO_CLS[i] + '" data-fam="' + i + '" value="' + esc(famName(i)) +
        '" maxlength="12" aria-label="' + (i + 1) + '번째 집 이름">';
    }
    html += '</div>';

    html += '<div class="filters">' +
      '<button data-f="all" aria-pressed="' + (filter === 'all') + '">전체 ' + total + '</button>' +
      '<button data-f="left" aria-pressed="' + (filter === 'left') + '">남은 것 ' + (total - done) + '</button>';
    for (var k = 0; k < FAM_N; k++) {
      var nk = state.items.filter(function (x) { return x.who === k; }).length;
      html += '<button data-f="f' + k + '" aria-pressed="' + (filter === 'f' + k) + '">' +
        esc(famName(k)) + ' ' + nk + '</button>';
    }
    html += '</div>';

    cats.forEach(function (cat) {
      var all = state.items.filter(function (i) { return i.cat === cat; });
      var list = all.filter(visible);
      if (!list.length && filter !== 'all') return;
      var d = all.filter(function (i) { return i.done; }).length;

      html += '<section><div class="sec-head"><h2>' + esc(cat) + '</h2>' +
        '<span class="tally">' + d + '/' + all.length + '</span></div><ul class="items">';

      list.forEach(function (it) {
        var w = (it.who >= 0 && it.who < FAM_N) ? it.who : -1;
        var whoCls = w >= 0 ? WHO_CLS[w] : '';
        var whoTxt = w >= 0 ? famName(w) : '담당 +';
        var isOpen = !!open[it.id];
        html += '<li class="' + (it.done ? 'done ' : '') + (isOpen ? 'open' : '') + '" data-id="' + it.id + '">' +
          '<div class="row">' +
          '<button class="box" role="checkbox" aria-checked="' + it.done + '" data-act="toggle" aria-label="완료 체크"></button>' +
          '<div class="body"><div class="name">' + esc(it.name) + '</div>' +
          (it.memo && !isOpen ? '<div class="memo-peek">✎ ' + esc(it.memo) + '</div>' : '') +
          '</div>' +
          '<button class="who ' + whoCls + '" data-act="who">' + esc(whoTxt) + '</button>' +
          '<button class="more' + (isOpen ? ' on' : '') + '" data-act="more" aria-label="고치기">✎</button>' +
          '</div>' +
          '<div class="panel">' +
          '<label>항목 이름</label>' +
          '<input type="text" data-act="rename" value="' + esc(it.name) + '" maxlength="120">' +
          '<label>메모</label>' +
          '<textarea data-act="memo" placeholder="수량, 누가 사올지, 빠뜨리기 쉬운 것">' + esc(it.memo) + '</textarea>' +
          '<button class="del" data-act="del">이 항목 삭제</button></div>' +
          '</li>';
      });

      html += '</ul>';
      if (filter === 'all') {
        html += '<div class="adder" data-cat="' + esc(cat) + '">' +
          '<input placeholder="항목 추가" aria-label="' + esc(cat) + '에 항목 추가">' +
          '<button data-act="add">추가</button></div>';
      }
      html += '</section>';
    });

    if (filter !== 'all' && !state.items.filter(visible).length) {
      html += '<div class="empty">해당하는 항목이 없어요.</div>';
    }

    html += '<div class="foot">' +
      '<span class="conn ' + conn.state + '">' + esc(CONN_TEXT[conn.state] || '') + '</span>' +
      '<button data-act="reset">처음 목록으로 되돌리기</button>' +
      '<span class="status"></span>' +
      '<p class="note">이 목록은 링크를 연 모든 사람이 함께 보고 고칩니다. ' +
      '한 집에서 체크하면 다른 집 화면에 바로 반영되니 새로고침할 필요가 없습니다. ' +
      '✎ 를 누르면 항목 이름과 메모를 고칠 수 있습니다.</p>' +
      '</div>';

    var f = captureFocus();
    app.innerHTML = html;
    restoreFocus(f);
  }

  // 다른 집이 바꾼 내용이 도착하면 화면을 통째로 다시 그리기 때문에,
  // 그 순간 입력 중이던 칸의 내용과 커서 위치를 잃지 않도록 되살린다.
  function captureFocus() {
    var el = document.activeElement;
    if (!el || !app.contains(el) || el.value === undefined) return null;
    var li = el.closest('li');
    var adder = el.closest('.adder');
    var kind = el.matches('textarea[data-act="memo"]') ? 'memo'
             : el.matches('input[data-act="rename"]') ? 'rename'
             : el.matches('.crew input') ? 'fam'
             : (adder ? 'adder' : null);
    if (!kind) return null;
    return {
      kind: kind,
      id: li ? li.getAttribute('data-id') : null,
      fam: el.getAttribute('data-fam'),
      cat: adder ? adder.getAttribute('data-cat') : null,
      value: el.value,
      start: el.selectionStart,
      end: el.selectionEnd
    };
  }

  function restoreFocus(f) {
    if (!f) return;
    var el = null;
    if (f.kind === 'memo' && f.id) {
      el = app.querySelector('li[data-id="' + f.id + '"] textarea[data-act="memo"]');
    } else if (f.kind === 'rename' && f.id) {
      el = app.querySelector('li[data-id="' + f.id + '"] input[data-act="rename"]');
    } else if (f.kind === 'fam') {
      el = app.querySelector('.crew input[data-fam="' + f.fam + '"]');
    } else if (f.kind === 'adder' && f.cat != null) {
      var wrap = app.querySelector('.adder[data-cat="' + f.cat.replace(/"/g, '\\"') + '"]');
      el = wrap ? wrap.querySelector('input') : null;
    }
    if (!el) return;
    el.value = f.value;               // 입력 중이던 내용이 우선이다
    el.focus();
    try { el.setSelectionRange(f.start, f.end); } catch (e) {}
  }

  function find(id) {
    for (var i = 0; i < state.items.length; i++) if (state.items[i].id === id) return state.items[i];
    return null;
  }

  app.addEventListener('click', function (e) {
    var btn = e.target.closest('button');
    if (!btn) return;
    var act = btn.getAttribute('data-act');

    if (act === 'plan') {
      planOpen = !planOpen;
      try { localStorage.setItem(PLAN_KEY, planOpen ? '1' : '0'); } catch (e) {}
      render();
      return;
    }
    if (btn.hasAttribute('data-f')) { filter = btn.getAttribute('data-f'); render(); return; }

    var li = btn.closest('li');
    var it = li ? find(li.getAttribute('data-id')) : null;

    if (act === 'toggle' && it) {
      it.done = !it.done;
      send({ t: 'set', id: it.id, patch: { done: it.done } });
      cacheSave(); render(); return;
    }
    if (act === 'who' && it) {
      var w = (it.who >= 0 && it.who < FAM_N) ? it.who : -1;
      it.who = (w + 1 >= FAM_N) ? -1 : w + 1;
      send({ t: 'set', id: it.id, patch: { who: it.who } });
      cacheSave(); render(); return;
    }
    if (act === 'more' && it) {
      open[it.id] = !open[it.id];
      render();
      var inp = app.querySelector('li[data-id="' + it.id + '"] input[data-act="rename"]');
      if (inp) inp.focus();
      return;
    }
    if (act === 'del' && it) {
      state.items = state.items.filter(function (x) { return x.id !== it.id; });
      send({ t: 'del', id: it.id });
      cacheSave(); render(); return;
    }
    if (act === 'add') {
      var wrap = btn.closest('.adder');
      var input = wrap.querySelector('input');
      var val = input.value.trim();
      if (!val) { input.focus(); return; }
      // 여러 기기에서 동시에 추가해도 겹치지 않는 id 를 쓴다.
      var item = {
        id: 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
        cat: wrap.getAttribute('data-cat'),
        name: val, memo: '', done: false, who: -1,
        ord: state.items.reduce(function (m, x) { return Math.max(m, x.ord || 0); }, 0) + 1000
      };
      state.items.push(item);
      send({ t: 'add', item: { id: item.id, cat: item.cat, name: item.name } });
      input.value = '';
      cacheSave(); render(); return;
    }
    if (act === 'reset') {
      if (!confirm('모두의 체크와 메모가 사라지고 기본 목록으로 돌아갑니다. 세 집 화면 모두 초기화됩니다. 계속할까요?')) return;
      var s = seed();
      state = s;
      send({ t: 'reset', families: s.families, items: s.items });
      cacheSave(); render(); return;
    }
  });

  app.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && e.target.matches('.adder input')) {
      e.target.closest('.adder').querySelector('button').click();
    }
    if (e.key === 'Enter' && e.target.matches('input[data-act="rename"]')) {
      e.target.blur();
    }
  });

  app.addEventListener('input', function (e) {
    var t = e.target;
    if (t.matches('textarea[data-act="memo"]')) {
      var mi = find(t.closest('li').getAttribute('data-id'));
      if (mi) { mi.memo = t.value; queuePatch(mi.id, { memo: mi.memo }); }
    }
    if (t.matches('input[data-act="rename"]')) {
      var ri = find(t.closest('li').getAttribute('data-id'));
      // 빈 이름은 보내지 않는다. 지웠다가 다시 쓰는 중일 수 있다.
      if (ri && t.value.trim()) { ri.name = t.value.trim(); queuePatch(ri.id, { name: ri.name }); }
    }
    if (t.matches('.crew input')) {
      var fi = +t.getAttribute('data-fam');
      var v = t.value || FAM_DEFAULT[fi];
      state.families[fi] = v;
      queueFam(fi, v);
    }
  });

  app.addEventListener('change', function (e) {
    if (e.target.matches('.crew input')) render();
    // 이름 칸을 비운 채 빠져나가면 원래 이름으로 되돌린다.
    if (e.target.matches('input[data-act="rename"]') && !e.target.value.trim()) render();
  });

  // 캐시로 먼저 그려 흰 화면을 피하고, 연결되면 서버 상태로 덮어쓴다.
  state = cacheLoad() || seed();
  render();
  connect();
})();
</script>
</body>
</html>
